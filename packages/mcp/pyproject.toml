[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algenta-mcp"
version = "1.0.12"
description = "Algenta MCP server for Cursor, Codex, and other Model Context Protocol clients."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["mcp", "model-context-protocol", "cursor", "codex", "claude", "algenta", "agent", "tools", "agent-governance", "receipts", "approvals"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
# Standalone client: depends on the published SDK (for the API client + egress guard) + the MCP
# protocol lib + an ASGI stack for Streamable HTTP. NO monorepo (apps.*) dependency.
dependencies = [
    "algenta-sdk>=1.0.0",
    "mcp==2.0.0",
    # mcp==2.0.0's own new dependency (a distinct successor package to httpx; non-conflicting with
    # the httpx pin below). mcp-types==2.0.0 resolves transitively via mcp's own hard pin.
    "httpx2>=2.5.0",
    "fastapi==0.133.1",
    "starlette==1.3.1",
    "uvicorn==0.51.0",
    "httpx>=0.28.0",
    # mcp==2.0.0 requires pydantic>=2.12.0 (was >=2.7.2 under mcp==1.28.1).
    "pydantic>=2.12.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "respx", "ruff"]

[project.scripts]
algenta-mcp = "algenta_mcp.server:main"

[project.urls]
Homepage = "https://docs.algenta.ai"
Documentation = "https://docs.algenta.ai/sdk/mcp"
Repository = "https://github.com/thyn-ai/algenta-sdk"

[tool.setuptools.packages.find]
where = ["."]
include = ["algenta_mcp*"]
