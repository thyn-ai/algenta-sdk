[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algenta-sdk"
version = "1.0.8"
description = "Python SDK for Algenta — public data, query, and simulation API"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["decision", "simulation", "monte-carlo", "probabilistic", "risk", "api", "algenta"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx", "black", "ruff"]

[project.urls]
Homepage = "https://algenta.ai"
Documentation = "https://docs.algenta.ai"
Repository = "https://github.com/thyn-ai/algenta-sdk"
"Bug Tracker" = "https://github.com/thyn-ai/algenta-sdk/issues"
Changelog = "https://docs.algenta.ai/changelog"

[tool.setuptools.packages.find]
where = ["."]
include = ["decision_engine*"]
