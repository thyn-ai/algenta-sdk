[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algenta-sdk"
version = "1.0.16"
description = "Python SDK for Algenta — public data, query, and simulation API"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["decision", "simulation", "monte-carlo", "probabilistic", "risk", "api", "algenta", "mcp", "model-context-protocol", "ai-agents", "agent-governance", "mojo", "receipts", "audit-trail"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "respx", "black", "ruff"]

[project.urls]
Homepage = "https://algenta.ai"
Documentation = "https://docs.algenta.ai"
Repository = "https://github.com/thyn-ai/algenta-sdk"
"Bug Tracker" = "https://github.com/thyn-ai/algenta-sdk/issues"
Changelog = "https://docs.algenta.ai/changelog"

[tool.setuptools.packages.find]
where = ["."]
include = ["decision_engine*"]

# This package is mirrored, unmodified, into the public thyn-ai/algenta-sdk repo (see
# ../../.github/workflows/sync-public-sdk.yml and release-sdks.yml) -- that repo's own CI has
# no access to this monorepo's root pyproject.toml, so without a [tool.ruff] table here its
# `ruff check packages/python-sdk` step falls back to ruff's bare defaults and has run with a
# permanent `|| true` since the day it was first turned on. This config gives that check a real,
# self-contained ruleset instead. It does not, by itself, remove the `|| true` in algenta-sdk's
# ci.yml -- that requires a `security/baseline/ruff.txt`-style baseline measured on THAT repo's
# own CI first (never from a laptop), which needs thyn-ai/algenta-sdk#29 merged before it can run.
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
]
