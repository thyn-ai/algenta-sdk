version: 2
updates:
  # Only the workflow pins live natively in this repository. packages/python-sdk,
  # packages/ts-sdk and examples/ are mirrored from the Algenta engine (closed
  # source) by the internal sync pipeline, so dependency bumps must land there --
  # a Dependabot PR here would be overwritten by the next sync.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
    commit-message:
      prefix: "chore(ci)"
