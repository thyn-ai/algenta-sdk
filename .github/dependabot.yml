# Every group is restricted to `update-types: [minor, patch]`. Without that key a group also
# swallows semver-major bumps, and the first grouped PRs did exactly that: thyn-ai/thyn-site#60
# bundled typescript 5 -> 7, @types/node 22 -> 26, @sanity/client 7 -> 8 and marked 15 -> 18 in
# with nine patch/minor bumps, and its preview build failed as one unit that could be neither
# reviewed nor reverted one dependency at a time. A major now opens as its own PR, judged on its
# own build and revertible on its own; nothing is ignored on that account.
version: 2
updates:
  # packages/python-sdk, packages/ts-sdk and examples/ are mirrored from the
  # Algenta engine (closed source) by the internal sync pipeline, so dependency
  # bumps for the SDKs themselves must land there -- a Dependabot PR here would
  # be overwritten by the next sync. What lives natively in this repository, and
  # is therefore refreshed from here, is the workflow action pins plus the two
  # hash-pinned CI tooling manifests under .github/ (the pip and npm entries).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
        # minor + patch only: a major opens as its own PR (see the header).
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(ci)"

  # .github/requirements/*.{in,txt}: the hash-pinned toolchains CI installs with
  # --require-hashes -- python-sdk-ci (pytest / hypothesis / ruff for the python-sdk
  # lane) and release-* (cryptography, build, twine for release.yml). One weekly
  # grouped PR refreshes every pin and its hashes together.
  - package-ecosystem: "pip"
    directory: "/.github/requirements"
    schedule:
      interval: "weekly"
    groups:
      python-sdk-ci-tooling:
        patterns:
          - "*"
        # minor + patch only: a major opens as its own PR (see the header).
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(ci)"

  # .github/tsx-runner/package-lock.json: the pinned tsx tree the
  # examples-shared CI lane runs through.
  - package-ecosystem: "npm"
    directory: "/.github/tsx-runner"
    schedule:
      interval: "weekly"
    groups:
      tsx-runner:
        patterns:
          - "*"
        # minor + patch only: a major opens as its own PR (see the header).
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(ci)"
