# Publishes algenta-sdk to PyPI and npm. This is the ONLY workflow, in either
# the Algenta engine repository (closed source) or this repo, that ever runs
# `twine upload` / `npm publish` for real.
#
# Every asset attached to the GitHub Release (wheel, sdist,
# release-manifest.json) also gets a keyless Sigstore signature bundle
# (<asset>.sigstore.json) and SLSA build provenance (multiple.intoto.jsonl),
# produced by the last two jobs -- see "Verify a release" in README.md.
#
# Release authority belongs to the Algenta engine (closed source): this
# workflow refuses to build or publish anything unless
# releases/authorization/sdk-<tag>.json verifies against the exact tag/commit
# it's running against. See scripts/verify_release_authorization.py.
#
# Lifecycle note: the engine signs a release candidate BEFORE the
# authorization file exists here -- the signer records the pre-PR tip as
# sdk_commit -- and the file itself is delivered to `main` afterwards via a
# reviewed PR like any other sync change. A commit can therefore never
# contain its own authorization, so D0 reads the file from `main` (which
# holds every merged authorization) rather than from the tagged tree. That
# changes only WHERE the file is read from, never WHAT is verified: the
# version must match the tag, sdk_commit must equal the tagged commit, the
# contract digest must match the tagged tree, and the Ed25519 signature must
# verify against the embedded engine public key.
#
# Publish auth is the same PYPI_TOKEN / NPM_TOKEN every other package in the
# org already publishes with (repo secrets on this repo). No OIDC/Trusted
# Publisher registration involved.
#
# PREREQUISITE: repo secrets `PYPI_TOKEN` and `NPM_TOKEN` set on
# thyn-ai/algenta-sdk.

name: release

# Two triggers, one gate:
#
# - push/tags is the designed path for all FUTURE releases: their tag commits
#   branch from main, so the tagged tree already contains this workflow and
#   tag-push runs it directly.
#
# - workflow_dispatch exists because tag-push runs resolve the workflow file
#   from the TAGGED COMMIT, not the default branch. A tag pointing at a
#   commit older than a release.yml fix can therefore never run the fixed
#   copy via tag push -- that is exactly how sdk-v1.0.8 got stranded (its
#   tag commit fa4aa8d1 predates the D0 read-from-main fix). Dispatching
#   from main runs THIS file and checks out the requested tag, so such
#   pre-fix tags can still be published through the exact same gate. The
#   dispatch path is verified to behave identically: every job checks out
#   the requested tag, and all provenance records the CHECKED-OUT commit
#   (never github.sha, which on a dispatch run is main's tip).
on:
  push:
    tags: ["sdk-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Full tag to release, e.g. sdk-v1.0.8"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-authorization:
    name: verify release authorization (D0 -- gates everything below)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Dispatch-only pre-flight, BEFORE any checkout: a bad tag input must
      # fail loud here, never steer the run at some tree.
      - name: Validate the requested tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_FETCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            sdk-v*) ;;
            *) echo "::error::Invalid tag input '$RELEASE_TAG' -- must match sdk-v* (e.g. sdk-v1.0.8)." >&2; exit 1 ;;
          esac
          if printf '%s' "$RELEASE_TAG" | LC_ALL=C grep -qE '[^A-Za-z0-9._-]'; then
            echo "::error::Invalid tag input '$RELEASE_TAG' -- contains characters outside [A-Za-z0-9._-]." >&2
            exit 1
          fi
          if ! curl -sfL \
              -H "Authorization: Bearer ${GH_FETCH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -o /dev/null \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}"; then
            echo "::error::Tag '$RELEASE_TAG' does not exist on ${GITHUB_REPOSITORY} -- refusing to run." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # tag push: github.ref IS the pushed tag; dispatch: check out the
          # requested tag explicitly (the dispatch run itself sits on main).
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve version from the tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#sdk-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Tooling comes from hash-locked requirements files
      # (.github/requirements/*.txt, refreshed by Dependabot), read from the
      # commit THIS workflow file was loaded from: github.workflow_sha is the
      # tag on a push and the dispatched branch's tip on a workflow_dispatch.
      # Not from the checked-out tree, for the same reason the authorization
      # is read from main below: a dispatch of an older tag must still find
      # the files that belong to the workflow copy it is running. Fetched once
      # here, before any side effect, and handed to the jobs below as the
      # `release-tooling` artifact (publish-pypi has no checkout by design).
      - name: Fetch the hash-locked tooling requirements
        env:
          GH_FETCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-tooling"
          for name in release-authorization release-build release-publish; do
            if ! curl -sfL \
                -H "Authorization: Bearer ${GH_FETCH_TOKEN}" \
                -H "Accept: application/vnd.github.raw+json" \
                -o "$RUNNER_TEMP/release-tooling/${name}.txt" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.github/requirements/${name}.txt?ref=${WORKFLOW_SHA}"; then
              echo "::error::Could not fetch .github/requirements/${name}.txt at ${WORKFLOW_SHA} -- refusing to install unpinned tooling." >&2
              exit 1
            fi
          done

      - run: python -m pip install --quiet --disable-pip-version-check --require-hashes -r "$RUNNER_TEMP/release-tooling/release-authorization.txt"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-tooling
          path: ${{ runner.temp }}/release-tooling/

      # The authorization file is merged to `main` AFTER signing (a commit can
      # never contain its own authorization -- see the lifecycle note in the
      # header), so it is read from `main` here, not from the tagged tree.
      # Read-only contents fetch under this workflow's `contents: read`
      # permission; the checkout above keeps persist-credentials: false. If
      # the file was never merged to main, this step fails hard and nothing
      # below it runs.
      - name: Fetch the release authorization from main
        env:
          GH_FETCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          AUTH_FILE="$RUNNER_TEMP/sdk-v${VERSION}.authorization.json"
          if ! curl -sfL \
              -H "Authorization: Bearer ${GH_FETCH_TOKEN}" \
              -H "Accept: application/vnd.github.raw+json" \
              -o "$AUTH_FILE" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/releases/authorization/sdk-v${VERSION}.json?ref=main"; then
            echo "::error::No release authorization found at releases/authorization/sdk-v${VERSION}.json on main -- refusing to publish an unauthorized version." >&2
            exit 1
          fi
          echo "AUTH_FILE=${AUTH_FILE}" >> "$GITHUB_ENV"

      - name: Verify the release authorization (refuses to continue on any mismatch)
        run: |
          set -euo pipefail
          python scripts/verify_release_authorization.py \
            --authorization-file "$AUTH_FILE" \
            --expected-version "${{ steps.version.outputs.version }}" \
            --repo-root .

  build:
    name: build the exact authorized source
    needs: verify-authorization
    runs-on: ubuntu-latest
    outputs:
      # base64(sha256sum) of the release assets, consumed by `provenance`.
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Record source-to-package provenance (build-info)
        # Generated at build time, never committed -- a commit can't contain its own SHA.
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # HEAD is the checked-out tag commit in BOTH trigger paths. Never
          # github.sha here: on a workflow_dispatch run github.sha is main's
          # tip, which must not leak into release provenance.
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          BUILD_RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo '"""Generated at release build time. Not committed to git -- see release.yml."""'
            echo "SOURCE_REPO = \"https://github.com/${{ github.repository }}\""
            echo "SOURCE_COMMIT = \"$SOURCE_COMMIT\""
            echo "SOURCE_TAG = \"$RELEASE_TAG\""
            echo "BUILD_RUN = \"$BUILD_RUN\""
          } > packages/python-sdk/decision_engine/_build_info.py
          {
            echo "// Generated at release build time. Not committed to git -- see release.yml."
            echo "export const SOURCE_REPO = \"https://github.com/${{ github.repository }}\";"
            echo "export const SOURCE_COMMIT = \"$SOURCE_COMMIT\";"
            echo "export const SOURCE_TAG = \"$RELEASE_TAG\";"
            echo "export const BUILD_RUN = \"$BUILD_RUN\";"
          } > packages/ts-sdk/src/_build_info.ts

      # Hash-locked tooling from D0 (see the fetch step there).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tooling
          path: ${{ runner.temp }}/release-tooling

      - name: Build the Python SDK (wheel + sdist)
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check --require-hashes -r "$RUNNER_TEMP/release-tooling/release-build.txt"
          python -P -m build packages/python-sdk
          twine check packages/python-sdk/dist/*

      - name: Build the TypeScript SDK
        working-directory: packages/ts-sdk
        run: |
          npm ci --ignore-scripts
          npm run build
          npm pack --dry-run

      - name: Verify the built artifacts install like a real user's (fresh venv / fresh npm project)
        run: |
          set -euo pipefail
          python scripts/verify_python_artifact_install.py
          node scripts/verify_ts_sdk_artifact_install.mjs

      - name: Generate release manifest (source + artifact hashes, not published inside the packages)
        env:
          VERSION: ${{ needs.verify-authorization.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Checked-out tag commit, not github.sha (dispatch runs sit on main).
          SHA="$(git rev-parse HEAD)"
          export SHA
          python - <<'PYEOF'
          import hashlib, json, os
          from pathlib import Path

          def sha256_of(path: Path) -> str:
              h = hashlib.sha256()
              h.update(path.read_bytes())
              return h.hexdigest()

          artifacts = []
          for path in Path("packages/python-sdk/dist").glob("*"):
              artifacts.append({"name": path.name, "registry": "pypi", "sha256": sha256_of(path)})

          manifest = {
              "schema_version": 1,
              "product": "algenta-sdk",
              "version": os.environ["VERSION"],
              "source": {
                  "repository": f"https://github.com/{os.environ['REPOSITORY']}",
                  "commit": os.environ["SHA"],
                  "tag": os.environ["RELEASE_TAG"],
              },
              "artifacts": artifacts,
          }
          Path("release-manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")
          PYEOF

      # Subjects for the SLSA provenance: sha256sum of exactly the files the
      # Release carries, by asset (base) name so the provenance subjects match
      # the asset names, base64-encoded as the generator expects.
      - name: Compute release-asset digests for provenance
        id: hash
        run: |
          set -euo pipefail
          {
            (cd packages/python-sdk/dist && sha256sum -- *)
            sha256sum release-manifest.json
          } | tee "$RUNNER_TEMP/subjects.sha256sum"
          echo "hashes=$(base64 -w0 "$RUNNER_TEMP/subjects.sha256sum")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: |
            packages/python-sdk/dist/
            release-manifest.json
          retention-days: 90

  publish-pypi:
    name: publish to PyPI (token)
    needs: [verify-authorization, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # No checkout at all: this job holds PYPI_TOKEN and is deliberately
      # minimal -- it publishes artifacts built by the `build` job and has no
      # reason to have the repository on disk.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: .

      # Hash-locked tooling from D0 (see the fetch step there); still no checkout.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tooling
          path: ${{ runner.temp }}/release-tooling

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check --require-hashes -r "$RUNNER_TEMP/release-tooling/release-publish.txt"
          twine upload --non-interactive --skip-existing packages/python-sdk/dist/*

  publish-npm:
    name: publish to npm (token)
    needs: [verify-authorization, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Rebuild and publish
        working-directory: packages/ts-sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run build
          VERSION="$(node -p "require('./package.json').version")"
          PUBLISHED_VERSION="$(npm view "algenta-sdk@$VERSION" version 2>/dev/null || true)"
          if [ "$PUBLISHED_VERSION" = "$VERSION" ]; then
            echo "algenta-sdk@$VERSION is already published; skipping."
          else
            npm publish --access public
          fi

  publish-github-release:
    name: attach the release manifest to a GitHub Release
    needs: [verify-authorization, build, publish-pypi, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: .

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # tag push: github.ref_name is the pushed tag; dispatch: it is the
          # branch the run was dispatched on, so use the requested tag.
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            release-manifest.json
            packages/python-sdk/dist/*

  # The two jobs below run only once the Release exists and stay behind the
  # D0 gate through the same `needs:` chain as everything else. They sign and
  # attest the bytes the Release carries -- the `release-artifacts` artifact
  # the Release was uploaded from -- with nothing rebuilt or checked out.
  sign-release-assets:
    name: sign the release assets (Sigstore keyless)
    needs: [verify-authorization, build, publish-github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the .sigstore.json bundles to the Release
      id-token: write # Sigstore keyless signing with this job's OIDC identity
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: .

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: |
            release-manifest.json
            packages/python-sdk/dist/*
          # Verify each bundle right after signing, against the identity the
          # certificate must carry: this workflow file at the run's ref (the
          # tag on a push, the dispatched branch on a workflow_dispatch).
          # That is also the identity consumers verify -- see README.md.
          verify: true
          verify-cert-identity: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
          verify-oidc-issuer: https://token.actions.githubusercontent.com
          # The action's own upload fires only on `release` events; this
          # workflow runs on tag push / dispatch, so the step below uploads.
          release-signing-artifacts: false

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            release-manifest.json.sigstore.json
            packages/python-sdk/dist/*.sigstore.json

  provenance:
    name: attach SLSA provenance (generic generator)
    needs: [verify-authorization, build, publish-github-release]
    permissions:
      actions: read # the generator reads this run's workflow metadata
      id-token: write # keyless signing of the provenance
      contents: write # upload multiple.intoto.jsonl to the Release
    # Referenced by TAG -- deliberately the one exception to this repo's
    # SHA-pinning. The generator downloads its builder binary from the
    # release named by the ref it was called at, and slsa-verifier trusts the
    # generator only at a `vX.Y.Z` tag (its README, "Referencing SLSA builders
    # and generators"; slsa-framework/slsa-verifier#12). A SHA here fails the
    # job or yields provenance no verifier accepts. ossf/scorecard's own
    # release does the same. v2.1.0 = f7dd8c54c2067bafc12ca7a55595d5ee9b75204a.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: true
      # Named explicitly in both trigger paths: on a dispatch the run sits on
      # a branch, not on a new tag, so the generator must be told the Release.
      upload-tag-name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
