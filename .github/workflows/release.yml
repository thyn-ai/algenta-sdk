# Publishes algenta-sdk to PyPI and npm. This is the ONLY workflow, in either
# thyn-ai/algenta (the private engine repo) or this repo, that ever runs
# `twine upload` / `npm publish` for real -- see the approved SDK-repo
# extraction plan's Step 4 amendment for why publish EXECUTION lives here
# while release AUTHORITY stays with the private engine repo's full test
# suite: npm/PyPI's native provenance only activates when the publishing
# workflow itself runs from a public repository.
#
# Release authority still belongs to thyn-ai/algenta: this workflow refuses
# to build or publish anything unless releases/authorization/sdk-<tag>.json
# (delivered here via the engine repo's sync mechanism, reviewed and merged
# by a human like any other sync PR) verifies against the exact tag/commit
# it's running against. See scripts/verify_release_authorization.py.
#
# TODO(owner): this workflow is safe to merge now but cannot successfully
# publish until:
#   - thyn-ai/algenta-sdk + this exact workflow filename + the `pypi`/`npm`
#     environments below are registered as Trusted Publishers on pypi.org
#     and npmjs.com (account-holder login required on both, cannot be done
#     from a coding session).
#   - A real signed sdk-v* tag + matching releases/authorization/ file
#     actually exists (produced by the engine repo's sign-release-authorization
#     job once that's wired up there).

name: release

on:
  push:
    tags: ["sdk-v*"]

permissions:
  contents: read

jobs:
  verify-authorization:
    name: verify release authorization (D0 -- gates everything below)
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve version from the tag
        id: version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#sdk-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Python from the pre-provisioned runner tool cache: setup-python is unusable on
      # self-hosted macOS (it hardcodes the GitHub-hosted /Users/runner/hostedtoolcache).
      - name: Fleet Python 3.14 (pre-provisioned tool cache)
        run: echo "$RUNNER_TOOL_CACHE/Python/3.14.7/arm64/bin" >> "$GITHUB_PATH"

      - run: python -m pip install --quiet --disable-pip-version-check cryptography

      - name: Verify the release authorization (refuses to continue on any mismatch)
        run: |
          set -euo pipefail
          AUTH_FILE="releases/authorization/sdk-v${{ steps.version.outputs.version }}.json"
          if [ ! -f "$AUTH_FILE" ]; then
            echo "::error::No release authorization found at $AUTH_FILE -- refusing to publish an unauthorized version." >&2
            exit 1
          fi
          python scripts/verify_release_authorization.py \
            --authorization-file "$AUTH_FILE" \
            --expected-version "${{ steps.version.outputs.version }}" \
            --repo-root .

  build:
    name: build the exact authorized source
    needs: verify-authorization
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      # Python from the pre-provisioned runner tool cache: setup-python is unusable on
      # self-hosted macOS (it hardcodes the GitHub-hosted /Users/runner/hostedtoolcache).
      - name: Fleet Python 3.14 (pre-provisioned tool cache)
        run: echo "$RUNNER_TOOL_CACHE/Python/3.14.7/arm64/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"

      - name: Record source-to-package provenance (build-info)
        # Generated at build time, never committed -- a commit can't contain its own SHA.
        run: |
          set -euo pipefail
          SOURCE_COMMIT="${{ github.sha }}"
          BUILD_RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo '"""Generated at release build time. Not committed to git -- see release.yml."""'
            echo "SOURCE_REPO = \"https://github.com/${{ github.repository }}\""
            echo "SOURCE_COMMIT = \"$SOURCE_COMMIT\""
            echo "SOURCE_TAG = \"${{ github.ref_name }}\""
            echo "BUILD_RUN = \"$BUILD_RUN\""
          } > packages/python-sdk/decision_engine/_build_info.py
          {
            echo "// Generated at release build time. Not committed to git -- see release.yml."
            echo "export const SOURCE_REPO = \"https://github.com/${{ github.repository }}\";"
            echo "export const SOURCE_COMMIT = \"$SOURCE_COMMIT\";"
            echo "export const SOURCE_TAG = \"${{ github.ref_name }}\";"
            echo "export const BUILD_RUN = \"$BUILD_RUN\";"
          } > packages/ts-sdk/src/_build_info.ts

      - name: Build the Python SDK (wheel + sdist)
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check --upgrade build twine
          python -P -m build packages/python-sdk
          twine check packages/python-sdk/dist/*

      - name: Build the TypeScript SDK
        working-directory: packages/ts-sdk
        run: |
          npm ci --ignore-scripts
          npm run build
          npm pack --dry-run

      - name: Generate release manifest (source + artifact hashes, not published inside the packages)
        run: |
          set -euo pipefail
          python - <<'PYEOF'
          import hashlib, json, os
          from pathlib import Path

          def sha256_of(path: Path) -> str:
              h = hashlib.sha256()
              h.update(path.read_bytes())
              return h.hexdigest()

          artifacts = []
          for path in Path("packages/python-sdk/dist").glob("*"):
              artifacts.append({"name": path.name, "registry": "pypi", "sha256": sha256_of(path)})

          manifest = {
              "schema_version": 1,
              "product": "algenta-sdk",
              "version": os.environ["VERSION"],
              "source": {
                  "repository": f"https://github.com/{os.environ['REPOSITORY']}",
                  "commit": os.environ["SHA"],
                  "tag": os.environ["REF_NAME"],
              },
              "artifacts": artifacts,
          }
          Path("release-manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")
          PYEOF
        env:
          VERSION: ${{ needs.verify-authorization.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: |
            packages/python-sdk/dist/
            release-manifest.json
          retention-days: 90

  publish-pypi:
    name: publish to PyPI (Trusted Publishing, OIDC)
    needs: [verify-authorization, build]
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    environment: pypi
    permissions:
      id-token: write # required for PyPI Trusted Publishing
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: .

      # TODO(owner): requires thyn-ai/algenta-sdk + release.yml + the `pypi`
      # environment registered as a PyPI Trusted Publisher first.
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: packages/python-sdk/dist
          skip-existing: true

  publish-npm:
    name: publish to npm (Trusted Publishing, OIDC provenance)
    needs: [verify-authorization, build]
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    environment: npm
    permissions:
      id-token: write # required for npm provenance / Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Rebuild and publish
        working-directory: packages/ts-sdk
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run build
          VERSION="$(node -p "require('./package.json').version")"
          PUBLISHED_VERSION="$(npm view "algenta-sdk@$VERSION" version 2>/dev/null || true)"
          if [ "$PUBLISHED_VERSION" = "$VERSION" ]; then
            echo "algenta-sdk@$VERSION is already published; skipping."
          else
            npm publish --provenance --access public
          fi
        # TODO(owner): once npm Trusted Publishing is registered for this repo,
        # this step needs no NODE_AUTH_TOKEN at all -- OIDC handles auth. Until
        # then this job will fail at publish time, which is correct: it should
        # not silently fall back to a stored token.

  publish-github-release:
    name: attach the release manifest to a GitHub Release
    needs: [verify-authorization, build, publish-pypi, publish-npm]
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: .

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release-manifest.json
            packages/python-sdk/dist/*
