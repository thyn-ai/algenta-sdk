# Metadata-only CLA check. This workflow must NEVER check out the
# contributor's branch or run any contributor-controlled script — it only
# records/verifies a signature and comments on the PR. Do not add a
# `actions/checkout` step with `ref: ${{ github.event.pull_request.head.sha }}`
# to this file; that would execute fork-controlled refs in a context that
# has write access to PRs.
name: cla-check

on:
  pull_request_target:
    types: [opened, closed, synchronize]
  issue_comment:
    types: [created]

permissions:
  # The four scopes contributor-assistant/github-action documents as required. Withholding
  # `contents` was the intent here, but it made the check impossible rather than stricter: with
  # `permissions:` declared, every omitted scope is `none`, so the action could not even read the
  # PR's commits — it failed on its first call, `graphql call to get the committers details failed:
  # Resource not accessible by integration`, before any write was attempted. It then needs write to
  # create the `cla-signatures` branch and maintain the signature file (that branch did not exist
  # yet). Net effect of the old block: every human PR failed CLA, while the allowlisted bots passed
  # by short-circuiting before that call — so the failure looked intermittent.
  #
  # What actually keeps this safe is NOT a narrow token, it is that this workflow never executes
  # contributor-controlled code: no checkout step (see the header), no fork script, and the one
  # action is pinned to a full commit SHA. The elevated token is therefore only ever held by that
  # pinned action, never by fork content.
  #
  # To drop back to `contents: read`, move signature storage to a separate repository via the
  # action's `remote-organization-name` / `remote-repository-name` inputs (needs a PAT secret and
  # that repo to exist). Worth doing, but it is provisioning work, not a permissions edit.
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-check:
    # GitHub-hosted: this job reads only pull-request metadata (no checkout) and must
    # keep serving fork PRs once the repository is public.
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/thyn-ai/algenta-sdk/blob/main/CLA.md
          branch: cla-signatures
          # angelatgithub is the repository owner, and is already allowlisted this same way in
          # thyn-ai/algenta-integrations (dependabot[bot],github-actions[bot],angelatgithub). That
          # repo's cla-signatures branch holds {"signedContributors": []} -- it passes on the
          # ALLOWLIST, not on any signature -- so this aligns the two repos rather than granting
          # anything new.
          #
          # eplane11 is the SAME PERSON as angelatgithub: it is the GitHub account behind the
          # owner's angel@eplane.com git identity, which is what a local git config that has not
          # been pointed at the noreply address produces. PR #15 showed the effect -- one commit
          # authored angelatgithub (allowlisted, fine) and one authored eplane11 (not allowlisted),
          # so cla-check failed on a PR whose only author was the owner. Listing both identities
          # for one human is the accurate fix; the alternative, rewriting history on every PR that
          # happens to catch the other identity, fixes nothing and loses authorship. This grants no
          # third party anything.
          allowlist: dependabot[bot],github-actions[bot],codna-ai[bot],algenta-sdk-sync[bot],angelatgithub,eplane11
