# Metadata-only CLA check. This workflow must NEVER check out the
# contributor's branch or run any contributor-controlled script — it only
# records/verifies a signature and comments on the PR. Do not add a
# `actions/checkout` step with `ref: ${{ github.event.pull_request.head.sha }}`
# to this file; that would execute fork-controlled refs in a context that
# has write access to PRs.
name: cla-check

on:
  pull_request_target:
    types: [opened, closed, synchronize]
  issue_comment:
    types: [created]

permissions:
  # Only what's needed to read the PR and post/update a status comment —
  # nothing broader, and specifically no `contents` access.
  pull-requests: write
  statuses: write

jobs:
  cla-check:
    # Org-wide self-hosted fleet (org variable RUNNER_LABELS); GitHub-hosted
    # runners are billing-blocked for this org.
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/thyn-ai/algenta-sdk/blob/main/CLA.md
          branch: cla-signatures
          allowlist: dependabot[bot],algenta-sdk-sync[bot]
