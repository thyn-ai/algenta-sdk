# Tier-1, untrusted CI. Runs on every PR, including ones from forks. No
# secrets are referenced anywhere in this file, on purpose — this workflow
# must be safe to run against fully adversarial, contributor-controlled code.
#
# There is deliberately no publish/release job in this repository at all —
# see the engine repo's (private, thyn-ai/algenta) release-sdks.yml, which is
# the sole place PyPI/npm publishing happens, built from a signed sdk-v* tag
# in this repo.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-sdk:
    # Org-wide self-hosted fleet (org variable RUNNER_LABELS); GitHub-hosted
    # runners are billing-blocked for this org. This lane is secret-free by
    # design (untrusted fork PRs), matching the engine repo's posture.
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      # Python from the pre-provisioned runner tool cache: setup-python is unusable on
      # self-hosted macOS (it hardcodes the GitHub-hosted /Users/runner/hostedtoolcache).
      - name: Fleet Python 3.14 (pre-provisioned tool cache)
        run: |
          echo "$RUNNER_TOOL_CACHE/Python/3.14.7/arm64/bin" >> "$GITHUB_PATH"
          # isolate jobs from the runner user's site-packages (stale leftovers there
          # shadow/break freshly installed deps)
          echo "PYTHONNOUSERSITE=1" >> "$GITHUB_ENV"
      - run: python -m pip install --upgrade pip && pip install -e "packages/python-sdk[dev]"
      - run: pytest packages/python-sdk -v
      # Soft-fail, matching the engine repo's posture (it ruffs only apps/, with `|| true`, and
      # never lints this package). This is the first time any lane ever linted it -- 707 legacy
      # findings (F401/F821-via-star-imports/E402 facade style; the E9,F63,F7 fatal set is clean).
      # TODO: pay the debt down, then drop the `|| true` to make this a hard gate.
      - run: ruff check packages/python-sdk || true

  ts-sdk:
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"
          # setup-node's cache:npm tars up the runner's ENTIRE global npm cache dir every run.
          # On a persistent self-hosted runner (not the GitHub-hosted ephemeral VM this feature
          # assumes) that cache never resets between jobs across every repo the fleet serves, so
          # it balloons unbounded -- observed at ~4GB for this one small package, real disk
          # exhaustion on the runner host. Same fix as decision-engine's own ci.yml.
          package-manager-cache: false
      - working-directory: packages/ts-sdk
        run: npm ci --ignore-scripts
      - working-directory: packages/ts-sdk
        run: npm run lint
      - working-directory: packages/ts-sdk
        run: npm test

  # Blocks a PR that hand-edits either generated contract snapshot, UNLESS
  # the PR was opened by the internal sync App from the engine repo. Gated
  # on the authenticated actor GitHub records for the PR (github.event.
  # pull_request.user.login for an App-authored PR is an unforgeable
  # "<slug>[bot]" login set by GitHub itself) — never on a commit author
  # string, which any contributor can set to anything.
  contract-drift-check:
    # PR-only: on a main push there is no base ref to diff against.
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Check whether this PR touches a generated contract file
        id: touched
        env:
          GH_TOKEN: ${{ github.token }}
        # REST compare instead of `git fetch` + `git diff`: the checkout above is
        # persist-credentials:false on purpose (untrusted fork PRs), so the runner holds no git
        # credentials for this private repo and a fetch exits 128. The API call authenticates
        # as the job token instead, without leaving anything in .git/config.
        run: |
          if gh api "repos/${{ github.repository }}/compare/${{ github.event.pull_request.base.ref }}...${{ github.event.pull_request.head.sha }}" \
               --paginate --jq '.files[].filename' \
               | grep -qE '^packages/(python-sdk/decision_engine/_contract\.py|ts-sdk/src/contract\.ts)$'; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Reject unless the sync App opened this PR
        if: steps.touched.outputs.touched == 'true'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          # TODO: set to the real sync App's bot login once it's registered,
          # e.g. "algenta-sdk-sync[bot]".
          EXPECTED_AUTHOR: "algenta-sdk-sync[bot]"
        run: |
          if [ "$PR_AUTHOR" != "$EXPECTED_AUTHOR" ]; then
            echo "::error::Generated contract files were modified by $PR_AUTHOR, not the sync App ($EXPECTED_AUTHOR). These files are regenerated internally — see CONTRIBUTING.md." >&2
            exit 1
          fi
