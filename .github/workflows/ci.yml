# Tier-1, untrusted CI. Runs on every PR, including ones from forks. No
# secrets are referenced anywhere in this file, on purpose — this workflow
# must be safe to run against fully adversarial, contributor-controlled code.
#
# There is deliberately no publish/release job in this repository at all —
# PyPI/npm publishing happens in the Algenta engine's internal release
# pipeline (closed source), built from a signed sdk-v* tag in this repo.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-sdk:
    # GitHub-hosted (free for public repositories, serves fork PRs). This lane
    # is secret-free by design so it can run untrusted fork code.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip && pip install -e "packages/python-sdk[dev]"
      # The coverage floor is 15%, two points under the 17% measured when this
      # gate was introduced. Raise it as coverage improves; never lower it.
      - run: pytest packages/python-sdk -v --cov=decision_engine --cov-report=xml --cov-fail-under=15
      - run: ruff check packages/python-sdk
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          flags: python-sdk
          # Tokenless upload: CODECOV_TOKEN is not required for public
          # repositories, and this lane must stay secret-free to serve
          # untrusted fork PRs. fail_ci_if_error stays off: the enforced gate
          # is --cov-fail-under above, and a Codecov outage must not block
          # contributions.
          fail_ci_if_error: false

  ts-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          # No global npm cache: one small package, a cold `npm ci` is cheaper than the
          # cache tarball round-trip.
          package-manager-cache: false
      - working-directory: packages/ts-sdk
        run: npm ci --ignore-scripts
      - working-directory: packages/ts-sdk
        run: npm run lint
      # tsc build + vitest with v8 coverage; floors are enforced via
      # packages/ts-sdk/vitest.config.ts.
      - working-directory: packages/ts-sdk
        run: npm run test:coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./packages/ts-sdk/coverage/lcov.info
          flags: ts-sdk
          # Tokenless upload, same rationale as the python-sdk lane above.
          fail_ci_if_error: false

  # examples/shared/*.test.ts use node:test (not vitest) and import the
  # TypeScript SDK sources directly, so they run through tsx, which resolves
  # the .ts specifiers. The examples tree has no package.json of its own, so
  # tsx is installed ad hoc, pinned to an exact version.
  examples-shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install tsx (pinned)
        run: npm install --no-save --ignore-scripts --prefix "$RUNNER_TEMP/tsx-runner" tsx@4.23.13
      - name: Run shared example tests
        run: '"$RUNNER_TEMP/tsx-runner/node_modules/.bin/tsx" --test examples/shared/*.test.ts'

  # Blocks a PR that hand-edits either generated contract snapshot, UNLESS
  # the PR was opened by the internal sync App that mirrors contract updates
  # from the Algenta engine (closed source). Gated on the authenticated actor
  # GitHub records for the PR (github.event.pull_request.user.login for an
  # App-authored PR is an unforgeable "<slug>[bot]" login set by GitHub
  # itself) — never on a commit author string, which any contributor can set
  # to anything.
  contract-drift-check:
    # PR-only: on a main push there is no base ref to diff against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check whether this PR touches a generated contract file
        id: touched
        env:
          GH_TOKEN: ${{ github.token }}
        # REST compare instead of `git fetch` + `git diff`: the checkout above is
        # persist-credentials:false on purpose (untrusted fork PRs), so the runner holds
        # no git credentials and a fetch would fail. The API call authenticates as the
        # job token instead, without leaving anything in .git/config.
        run: |
          if gh api "repos/${{ github.repository }}/compare/${{ github.event.pull_request.base.ref }}...${{ github.event.pull_request.head.sha }}" \
               --paginate --jq '.files[].filename' \
               | grep -qE '^packages/(python-sdk/decision_engine/_contract\.py|ts-sdk/src/contract\.ts)$'; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Reject unless the sync App opened this PR
        if: steps.touched.outputs.touched == 'true'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          # The sync App's GitHub-recorded bot login.
          EXPECTED_AUTHOR: "algenta-sdk-sync[bot]"
        run: |
          if [ "$PR_AUTHOR" != "$EXPECTED_AUTHOR" ]; then
            echo "::error::Generated contract files were modified by $PR_AUTHOR, not the sync App ($EXPECTED_AUTHOR). These files are regenerated internally — see CONTRIBUTING.md." >&2
            exit 1
          fi
