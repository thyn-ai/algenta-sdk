# Maintains the draft release (categorized changelog) on every merge to main
# and applies conventional-commit labels to PRs (autolabeler).
#
# The pull_request leg exists for the autolabeler. It is skipped for fork
# PRs: the GITHUB_TOKEN is read-only there, and labeling is best-effort
# housekeeping, not a gate -- maintainers can label fork PRs manually.
name: Release Drafter

"on":
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  update-release-draft:
    name: Update release draft
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
