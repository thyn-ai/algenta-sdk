name: Fleet Python
description: >-
  Resolve a Python that actually has pip on whatever runner this job landed on, and install
  into a per-job virtualenv. Discovers the interpreter instead of assuming a path.

# WHY THIS EXISTS
#
# Four steps across ci.yml and release.yml used to say:
#
#     echo "$RUNNER_TOOL_CACHE/Python/3.14.7/arm64/bin" >> "$GITHUB_PATH"
#
# Three hardcoded promises about one machine -- a version, an architecture, and a tool-cache
# layout. All three broke at once when the org-wide RUNNER_LABELS moved these jobs off the Mac
# fleet onto Linux: that directory does not exist there, so PATH gained nothing, `python`
# silently resolved to the root-owned system interpreter, and pip died with
#
#     ERROR: Could not install packages due to an OSError:
#     [Errno 13] Permission denied: '/usr/local/bin/pip3'
#
# The `arm64` in that path is the tell -- it was written for macOS and kept working only for as
# long as the jobs happened to land there.
#
# Two separate lessons are encoded here:
#
#  1. DISCOVER, never hardcode. No pinned version, no pinned arch, no fixed list of interpreter
#     names. Each is a promise about one machine, and it breaks the moment the job lands on
#     another one.
#  2. A name on PATH is not a usable interpreter. The fleet image guarantees an interpreter, NOT
#     a writable site-packages (thyn-ai/algenta `infra/ci/image/manifest.toml`). `--user` is no
#     escape either, because PYTHONNOUSERSITE=1 is set below. A venv needs no privileges and
#     behaves identically on every runner.
#
# Same shape as the resolver proven in thyn-ai/codna#489. `release.yml` used the identical
# hardcoded line in three places, so the release path had the same latent break; it had simply
# not run since the fleet moved.

inputs:
  venv-name:
    description: Directory name for the per-job virtualenv.
    required: false
    default: algenta-sdk-ci-venv

runs:
  using: composite
  steps:
    - name: Resolve a Python with pip, into a venv
      shell: bash
      run: |
        set -uo pipefail
        CANDIDATES=""
        # Anything the runner's tool cache offers, newest first -- whatever versions and
        # architectures this particular machine happens to carry.
        if [ -n "${RUNNER_TOOL_CACHE:-}" ] && [ -d "$RUNNER_TOOL_CACHE/Python" ]; then
          for b in $(find "$RUNNER_TOOL_CACHE/Python" -type d -name bin 2>/dev/null | sort -Vr); do
            for n in python3 python; do
              [ -x "$b/$n" ] && CANDIDATES="$CANDIDATES $b/$n"
            done
          done
        fi
        # Every python* already on PATH, discovered from PATH itself, newest first.
        for d in $(printf '%s' "$PATH" | tr ':' ' '); do
          [ -d "$d" ] || continue
          for f in $(ls "$d" 2>/dev/null | grep -xE 'python3?(\.[0-9]+)?' | sort -Vr); do
            CANDIDATES="$CANDIDATES $d/$f"
          done
        done

        PY=""
        for c in $CANDIDATES; do
          if [ -x "$c" ] && "$c" -m pip --version >/dev/null 2>&1; then PY="$c"; break; fi
        done
        if [ -z "$PY" ]; then
          echo "::error::No Python with pip on this runner. That is a RUNNER IMAGE gap, not a defect in this pull request."
          echo "candidates probed:"; for c in $CANDIDATES; do echo "  $c"; done
          exit 1
        fi

        VENV="${RUNNER_TEMP:-$PWD}/${{ inputs.venv-name }}"
        "$PY" -m venv "$VENV"
        PY="$VENV/bin/python"
        echo "$VENV/bin" >> "$GITHUB_PATH"
        echo "PY=$PY" >> "$GITHUB_ENV"
        # Isolate from the runner user's site-packages: stale leftovers there shadow and break
        # freshly installed deps on a long-lived self-hosted runner.
        echo "PYTHONNOUSERSITE=1" >> "$GITHUB_ENV"
        echo "resolved interpreter: $PY ($("$PY" --version 2>&1))"
